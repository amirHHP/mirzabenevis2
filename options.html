<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MirzaBenevis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="options.css" rel="stylesheet">
</head>

<body>
    <div class="popup">
        <header class="popup-header">
            <div class="brand">
                <img class="brand-icon" src="images/128-mirzabenevis.png" alt="">
                <span class="brand-title">MirzaBenevis</span>
            </div>
            <div class="lang-toggle" role="group" aria-label="Interface language">
                <button type="button" class="lang-btn active" data-ui-lang="en">EN</button>
                <button type="button" class="lang-btn" data-ui-lang="fa">FA</button>
            </div>
        </header>

        <section class="card">
            <h2 class="card-title" data-i18n="sectionMeetings">Auto Meeting Log</h2>
            <button id="show-meetings-btn" class="btn btn-accent" type="button">
                <span data-i18n="meetingLogs">Meeting Logs</span>
            </button>
        </section>

        <section class="card">
            <h2 class="card-title" data-i18n="sectionGemini">Gemini Settings</h2>

            <div class="field">
                <label class="field-label" for="gemini-api-key" data-i18n="apiKeyLabel">Gemini API Key</label>
                <input id="gemini-api-key" class="field-input" type="password" autocomplete="off"
                    data-i18n-placeholder="apiKeyPlaceholder">
                <p class="field-hint" data-i18n="apiKeyHint">
                    Stored securely in Chrome sync storage. Required for meeting summaries.
                </p>
            </div>

            <div class="field">
                <label class="field-label" for="gemini-summary-language" data-i18n="summaryLanguageLabel">Summary language</label>
                <select id="gemini-summary-language" class="field-select">
                    <option value="en" data-i18n="langEnglish">English</option>
                    <option value="fa" data-i18n="langPersian">Persian (Farsi)</option>
                </select>
            </div>

            <button id="save-gemini-key-btn" class="btn btn-primary" type="button">
                <span data-i18n="saveSettings">Save settings</span>
            </button>
            <div id="options-status" class="status" aria-live="polite"></div>
        </section>
    </div>

    <script src="options.js"></script>
</body>

</html>
